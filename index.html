<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EternalZ — liaison</title><style>body{font:16px system-ui;margin:3rem auto;max-width:36rem;padding:0 1rem;background:#10232b;color:#e6f8f2}small{color:#a9c9c3}</style><h1>EternalZ</h1><p id="status">Recherche du serveur de test…</p><small>Le jeu se connecte automatiquement depuis l’application de test.</small><script>fetch('connection.json?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{document.getElementById('status').textContent=x&&x.url?'Serveur de test en ligne':'Serveur de test hors ligne'}).catch(()=>{document.getElementById('status').textContent='Serveur de test hors ligne'})</script></html>
